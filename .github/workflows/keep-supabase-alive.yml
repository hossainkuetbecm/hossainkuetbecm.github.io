name: Keep Supabase Alive

on:
  schedule:
    # প্রতিদিন ২ বার (সকাল ও সন্ধ্যায়) অটোমেটিক ডাটাবেস পিং করবে
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET "YOUR_SUPABASE_URL/rest/v1/YOUR_TABLE_NAME?select=*&limit=1" \
          -H "apikey: YOUR_ANON_KEY" \
          -H "Authorization: Bearer YOUR_ANON_KEY"
